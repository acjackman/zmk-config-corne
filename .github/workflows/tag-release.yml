name: tag-release

on:
  workflow_run:
    workflows: [ "Build" ]
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: tag-release
  cancel-in-progress: true

jobs:
  tag:
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: "Guard: skip if HEAD already tagged"
        id: guard
        run: |
          git fetch --force --tags
          if git tag --points-at HEAD | grep -E '^v[0-9]+' >/dev/null; then
            echo "HEAD already has a release tag; skipping."
            echo "already_tagged=true" >> $GITHUB_OUTPUT
          else
            echo "already_tagged=false" >> $GITHUB_OUTPUT
          fi

      - name: Compute next tag
        if: ${{ steps.guard.outputs.already_tagged != 'true' }}
        id: version
        run: |
          MONTH_PREFIX="v$(date -u +'%Y.%m')"

          # Find existing tags for this month
          EXISTING_TAGS=$(git tag -l "${MONTH_PREFIX}.*" | sort -V)

          if [ -z "$EXISTING_TAGS" ]; then
            # No tags for this month, start at 1
            NEXT_TAG="${MONTH_PREFIX}.1"
          else
            # Find the highest increment for this month
            LAST_TAG=$(echo "$EXISTING_TAGS" | tail -1)
            INCREMENT=$(echo "$LAST_TAG" | sed "s/${MONTH_PREFIX}\.//")
            NEXT_INCREMENT=$((INCREMENT + 1))
            NEXT_TAG="${MONTH_PREFIX}.${NEXT_INCREMENT}"
          fi

          echo "next_tag=$NEXT_TAG" >> $GITHUB_OUTPUT

      - name: Configure Git user
        if: ${{ steps.guard.outputs.already_tagged != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create tag if not exists
        if: ${{ steps.guard.outputs.already_tagged != 'true' }}
        env:
          TAG: ${{ steps.version.outputs.next_tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "No tag computed"; exit 1
          fi
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG$"; then
            echo "Tag $TAG already exists, skipping."
            exit 0
          fi
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
