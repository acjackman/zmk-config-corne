pull_request_rules:
  - name: Approve Dependabot PRs
    conditions:
      - author = dependabot[bot]
      - base = main
    actions:
      review:
        type: APPROVE
        message: "Automatically approved Dependabot update"

  - name: Auto-merge Dependabot PRs when CI passes
    conditions:
      - author = dependabot[bot]
      - base = main
      - check-success = build
      - -conflict
      - -draft
    actions:
      merge:
        method: squash
        commit_message_template: |
          {{ title }}

          {{ body }}
